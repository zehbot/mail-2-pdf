# Lokaler Test: Konfiguration in .env ablegen (nicht ins Repo!)
services:
  mail-to-pdf:
    build: .
    image: mail-to-pdf:dev
    container_name: mail-to-pdf
    env_file: private/.env
    command: ["--once", "--dry-run"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
