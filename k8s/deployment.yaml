apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail2web
  namespace: mail2web
  labels:
    app: mail2web
spec:
  replicas: 1                # genau eine Instanz - sonst verarbeitet jede Instanz dieselbe Mail
  strategy:
    type: Recreate           # kein paralleles Rollout mit zwei Pollern
  selector:
    matchLabels:
      app: mail2web
  template:
    metadata:
      labels:
        app: mail2web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mail2web
          image: mail2web:0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          envFrom:
            - configMapRef:
                name: mail2web-config
          env:
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail2web-secrets
                  key: IMAP_PASSWORD
            - name: SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mail2web-secrets
                  key: SSH_PRIVATE_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
