apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-to-pdf
  namespace: mail-to-pdf
  labels:
    app: mail-to-pdf
spec:
  replicas: 1                # genau eine Instanz - sonst verarbeitet jede Instanz dieselbe Mail
  strategy:
    type: Recreate           # kein paralleles Rollout mit zwei Pollern
  selector:
    matchLabels:
      app: mail-to-pdf
  template:
    metadata:
      labels:
        app: mail-to-pdf
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mail-to-pdf
          image: mail-to-pdf:0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          envFrom:
            - configMapRef:
                name: mail-to-pdf-config
          env:
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-to-pdf-secrets
                  key: IMAP_PASSWORD
            # Der Key kommt als Datei, nicht als Env-Variable:
            # Env-Werte stehen in /proc/<pid>/environ und in Crash-Dumps.
            - name: SSH_PRIVATE_KEY_FILE
              value: /run/secrets/ssh/id_ed25519
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ssh-key
              mountPath: /run/secrets/ssh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ssh-key
          secret:
            secretName: mail-to-pdf-secrets
            defaultMode: 0440          # Gruppe darf lesen (fsGroup 1000)
            items:
              - key: SSH_PRIVATE_KEY
                path: id_ed25519
