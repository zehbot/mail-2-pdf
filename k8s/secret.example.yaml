# VORLAGE - keine echten Zugangsdaten einchecken.
#
# Empfohlen: Secret aus Dateien erzeugen, damit der Key nicht in der Shell-History
# landet:
#
#   kubectl -n mail-to-pdf create secret generic mail-to-pdf-secrets \
#     --from-literal=IMAP_PASSWORD='...' \
#     --from-file=SSH_PRIVATE_KEY=/pfad/zum/id_ed25519
#
# Hinweis: bei --from-file wird der Inhalt 1:1 übernommen (echte Zeilenumbrüche).
apiVersion: v1
kind: Secret
metadata:
  name: mail-to-pdf-secrets
  namespace: mail-to-pdf
type: Opaque
stringData:
  IMAP_PASSWORD: "<postfach-passwort>"
  # Alternativ SSH_PRIVATE_KEY_FILE auf ein gemountetes Secret zeigen lassen
  SSH_PRIVATE_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <key>
    -----END OPENSSH PRIVATE KEY-----
